name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    name: Python on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run guard regression tests
        run: python3 tests/test_guard.py
        shell: bash
